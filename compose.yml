services:
  pdf-privacy-gateway:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8000"
    environment:
      APP_USERNAME: ${APP_USERNAME:?Set APP_USERNAME in .env}
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-1800}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-deu+eng}
      MAX_FILE_MB: ${MAX_FILE_MB:-20}
      MAX_BATCH_MB: ${MAX_BATCH_MB:-80}
      MAX_PAGES: ${MAX_PAGES:-60}
      MAX_DOCUMENTS: ${MAX_DOCUMENTS:-10}
    read_only: true
    tmpfs:
      - /tmp:size=1536m,mode=1777
    shm_size: 128m
    mem_limit: 3g
    cpus: 2
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
