services:
  pdf-privacy-gateway:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8000"
    environment:
      APP_USERNAME: ${APP_USERNAME:?Set APP_USERNAME in .env}
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env}
      APP_DATA_DIR: /data
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-1800}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-deu+eng}
      MAX_FILE_MB: ${MAX_FILE_MB:-20}
      MAX_BATCH_MB: ${MAX_BATCH_MB:-80}
      MAX_PAGES: ${MAX_PAGES:-60}
      MAX_DOCUMENTS: ${MAX_DOCUMENTS:-10}
    volumes:
      - account-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=1536m,mode=1777
    shm_size: 128m
    mem_limit: 3g
    # No CFS CPU quota: some Synology kernels cannot apply NanoCPUs limits.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Optional local tooling; not started by `docker compose up`.
  composer:
    image: composer:2
    profiles: ["tools"]
    working_dir: /app
    entrypoint: ["composer"]
    command: ["install", "--prefer-dist", "--no-interaction", "--no-progress", "--no-plugins"]
    environment:
      COMPOSER_ALLOW_SUPERUSER: "1"
      COMPOSER_HOME: /tmp/composer
    volumes:
      - .:/app

volumes:
  account-data:
